# Unitree G1, 29 DoF (unitree_rl_lab UNITREE_G1_29DOF_CFG)
#
# Isaac Sim spawns the USD unitree_rl_lab trains G1 with; MuJoCo builds the robot from the
# URDF that USD was made from (same 33.341 kg), see assets/robots/g1_29dof/SOURCE.md.

name: g1_29dof
display_name: Unitree G1 (29 DoF)   # shown in the shared-bundle README
urdf: {repo: assets/robots/g1_29dof/g1_29dof_rev_1_0.urdf}

base_body: pelvis

# Isaac Lab articulation joint order (deploy.yaml default_joint_pos indexes into this).
joints:
  - left_hip_pitch_joint
  - right_hip_pitch_joint
  - waist_yaw_joint
  - left_hip_roll_joint
  - right_hip_roll_joint
  - waist_roll_joint
  - left_hip_yaw_joint
  - right_hip_yaw_joint
  - waist_pitch_joint
  - left_knee_joint
  - right_knee_joint
  - left_shoulder_pitch_joint
  - right_shoulder_pitch_joint
  - left_ankle_pitch_joint
  - right_ankle_pitch_joint
  - left_shoulder_roll_joint
  - right_shoulder_roll_joint
  - left_ankle_roll_joint
  - right_ankle_roll_joint
  - left_shoulder_yaw_joint
  - right_shoulder_yaw_joint
  - left_elbow_joint
  - right_elbow_joint
  - left_wrist_roll_joint
  - right_wrist_roll_joint
  - left_wrist_pitch_joint
  - right_wrist_pitch_joint
  - left_wrist_yaw_joint
  - right_wrist_yaw_joint

init:
  height: 0.8          # pelvis z at spawn (training: 0.8)
  joint_pos:
    left_hip_pitch_joint: -0.1
    right_hip_pitch_joint: -0.1
    .*_knee_joint: 0.3
    .*_ankle_pitch_joint: -0.2
    .*_shoulder_pitch_joint: 0.3
    left_shoulder_roll_joint: 0.25
    right_shoulder_roll_joint: -0.25
    .*_elbow_joint: 0.97
    left_wrist_roll_joint: 0.15
    right_wrist_roll_joint: -0.15

# Training used ImplicitActuatorCfg: the PD runs inside the simulator (see RobotSpec.implicit_pd).
implicit_pd: true

motors:
  # Effort / velocity limits and armature of UNITREE_G1_29DOF_CFG's actuators.
  - joints: [.*_hip_pitch_.*, .*_hip_yaw_.*, waist_yaw_joint]   # N7520-14.3
    Y1: 88.0
    velocity_limit: 32.0
    armature: 0.01
  - joints: [.*_hip_roll_.*, .*_knee_.*]                        # N7520-22.5
    Y1: 139.0
    velocity_limit: 20.0
    armature: 0.01
  - joints: [.*_shoulder_.*, .*_elbow_.*, .*_wrist_roll.*, .*_ankle_.*, waist_roll_joint, waist_pitch_joint]  # N5020-16
    Y1: 25.0
    velocity_limit: 37.0
    armature: 0.01
  - joints: [.*_wrist_pitch.*, .*_wrist_yaw.*]                  # W4010-25
    Y1: 5.0
    velocity_limit: 22.0
    armature: 0.01

isaac:
  usd: {repo: assets/robots/g1_29dof/usd/g1_29dof_rev_1_0.usd, sha256: cfed730bb043c42708260f25bf3bdf49ac80deed5d5a49384721b8e01059a96e, bundle_dir: true}
  enabled_self_collisions: true
  solver_position_iteration_count: 8
  solver_velocity_iteration_count: 4

mujoco:
  replace_cylinders_with_capsules: true

camera:
  follow_offset: [-2.4, -1.7, 1.2]
  target_offset: [0.0, 0.0, -0.1]
