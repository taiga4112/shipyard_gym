name: basic
description: 基本的な移動・地形踏破の検証環境
notes:
- 名称と寸法はORTテストベッド一覧に合わせています
- '板状段差: 幅 4 cm の板を格子状に並べたもの。逆 L 字段差: 板の上端に幅 20 cm の板が乗ったもの'
- 'マンホール: x = 2 m の位置でフィールドを仕切る高さ 2 m の壁にある開口（y ≈ 8 m）。地上高＝開口の下端の高さ、奥行き＝壁の厚さ'
- '`0_x`〜`3_x`: 12 m 四方のフィールド。スタート側は高さ 2 m の L 字の壁で仕切られた幅 3 m の通路（x = −1〜2 m、y < 3
  m）'
- '`5_x`・`6_1`: 幅 4 m のレーン（x = −2〜2 m）。右側（x ≈ 2 m）に高さ 2 m の壁'
- 多くのシーンに、厚みのない板の看板がある（ゴールの目印と思われる。当たり判定は Isaac のみ）
- スタート位置は USD に含まれていないため、既定は (0, 0) から +y 向き（シーンごとに `spawn` で変更できます）
- '一覧にあって USD が無いもの: `1_3_1`（工字段差 60 cm）、R 付段差、`4_1`（障害物）'
defaults:
  spawn:
    pos:
    - 0.0
    - 0.0
    yaw_deg: 90.0
    ground_z: 0.0
  collision_exclude: []
  friction: 1.0
