name: basic
description: Basic locomotion and terrain traversal
notes:
- 'Plate steps: 4 cm wide plates arranged in a grid. Inverted-L steps: a 20 cm wide plate on top of each plate'
- 'Manholes: an opening (y ≈ 8 m) in a 2 m tall wall that divides the field at x = 2 m. Sill is the height
  of the opening''s lower edge above the ground; depth is the wall thickness'
- '`0_x` to `3_x`: a 12 m square field. The start side is a 3 m wide corridor (x = −1 to 2 m, y < 3 m) enclosed
  by a 2 m tall L-shaped wall'
- '`5_x` and `6_1`: a 4 m wide lane (x = −2 to 2 m) with a 2 m tall wall on the right (x ≈ 2 m)'
- Many scenes have a zero-thickness signboard plate (likely a goal marker; it collides in Isaac Sim only)
- The USD files carry no start pose, so the default spawn is (0, 0) facing +y (override per scene with `spawn`)
defaults:
  spawn:
    pos:
    - 0.0
    - 0.0
    yaw_deg: 90.0
    ground_z: 0.0
  collision_exclude: []
  friction: 1.0
